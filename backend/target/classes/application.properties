spring.application.name=flovera-backend

# ---- MySQL ----
# Create the database first:  CREATE DATABASE flovera_db;
spring.datasource.url=jdbc:mysql://localhost:3306/flovera_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# ---- JWT ----
# 256-bit secret, change this in production
flovera.jwt.secret=ChangeThisFloveraSecretKeyToSomethingLongAndRandom123456
flovera.jwt.expiration-ms=86400000

# ---- Default Admin ----
flovera.admin.email=admin123@flovera.com
flovera.admin.password=Admin@123
